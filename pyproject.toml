[project]
name = "idbi-ps4-risk-engine"
version = "0.1.0"
description = "IDBI Innovate 26 PS4 - 12-month loan stress prediction engine with common interpretation framework"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "shap>=0.46",
    "numba>=0.60",
    "llvmlite>=0.43",
    "tabpfn>=2.0",
    "optuna>=4.0",
    "networkx>=3.4",
    "pyarrow>=17.0",
    "kaggle>=1.6",
    "joblib>=1.4",
    "psycopg2-binary>=2.9",
    "matplotlib>=3.8",
    "imbalanced-learn>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "transformers>=5.13.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
